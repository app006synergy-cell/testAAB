name: Publish To Google Play Internal
on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MANIFEST_URL: ${{ github.event.client_payload.manifest_url }}
    steps:
      - name: 下载 build_manifest.json (来自阿里云OSS)
        id: get_manifest
        run: |
          curl -L --retry 3 --retry-connrefused "${{ env.MANIFEST_URL }}" -o manifest.json
          cat manifest.json

      - name: 解析manifest获取参数
        id: parse
        run: |
          PACKAGE_NAME=$(jq -r '.[0].package_name' manifest.json)
          AAB_URL=$(jq -r '.[0].aab_url' manifest.json)
          MAPPING_URL=$(jq -r '.[0].mapping_url' manifest.json)
          VERSION_CODE=$(jq -r '.[0].version_code' manifest.json)
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "AAB_URL=$AAB_URL" >> $GITHUB_ENV
          echo "MAPPING_URL=$MAPPING_URL" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: 下载AAB包（OSS传输加速域名）
        run: |
          curl -L --retry 3 --retry-connrefused "${{ env.AAB_URL }}" -o app-release.aab

      - name: 下载mapping混淆表
        run: |
          curl -L --retry 3 --retry-connrefused "${{ env.MAPPING_URL }}" -o mapping.txt

      - name: 写入Google Play服务账号json文件
        run: |
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > service-account-key.json

      - name: 安装fastlane
        run: |
          sudo gem install fastlane

      - name: Fastlane‑supply上传到Google Play【internal内测轨道】
        run: |
          fastlane supply \
            --json_key service-account-key.json \
            --package_name ${{ env.PACKAGE_NAME }} \
            --aab ./app-release.aab \
            --track internal \
            --mapping ./mapping.txt \
            --version_code ${{ env.VERSION_CODE }}
